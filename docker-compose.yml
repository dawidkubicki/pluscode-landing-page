name: pluscode

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pluscode}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pluscode}
      POSTGRES_DB: ${POSTGRES_DB:-pluscode}
    ports:
      # Host-only: lets `pnpm dev` on the host connect; never exposed publicly.
      # Port 5434 to avoid clashing with other local Postgres instances.
      - "127.0.0.1:5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pluscode} -d ${POSTGRES_DB:-pluscode}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Only starts with the `prod` profile (docker compose --profile prod up).
  # Plain `docker compose up` (dev) brings up just the db.
  app:
    profiles: ["prod"]
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URI: postgresql://${POSTGRES_USER:-pluscode}:${POSTGRES_PASSWORD:-pluscode}@db:5432/${POSTGRES_DB:-pluscode}
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:?set PAYLOAD_SECRET in .env}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RECAPTCHA_SECRET_KEY: ${RECAPTCHA_SECRET_KEY:-}
      NEXT_PUBLIC_RECAPTCHA_SITE_KEY: ${NEXT_PUBLIC_RECAPTCHA_SITE_KEY:-}
      CONTACT_EMAIL: ${CONTACT_EMAIL:-}
    ports:
      - "3000:3000"
    volumes:
      - media:/app/media

volumes:
  pgdata:
  media:
