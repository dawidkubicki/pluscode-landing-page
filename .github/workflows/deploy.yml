# Push to master builds the Docker image, pushes it to GHCR, then SSHes to the
# VPS and restarts only this site's container (see quanty/infra playbook).
# Required repo secrets: VPS_HOST, VPS_SSH_KEY.
name: Deploy

on:
  push:
    branches: [main, master]
  workflow_dispatch: {}

concurrency:
  group: deploy-${{ github.repository }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/dawidkubicki/pluscode-landing-page
  SERVICE: landing-pluscode

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read # lets GITHUB_TOKEN pull the private image
    steps:
      - uses: appleboy/ssh-action@v1
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: deploy
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: GHCR_TOKEN,GHCR_USER
          script: |
            set -e
            # Serialize deploys: all sites share one Docker daemon, and a
            # concurrent prune corrupts an in-flight pull.
            exec 9>/tmp/quanty-deploy.lock
            flock -w 900 9 || { echo "Timed out waiting for the deploy lock"; exit 1; }

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            cd /srv/stack
            docker compose pull ${{ env.SERVICE }}
            docker compose up -d --no-deps ${{ env.SERVICE }}
            docker logout ghcr.io
            # Safe here only because the whole script holds the deploy lock
            # (see the flock at the top): an unlocked prune GCs the containerd
            # ingest blobs of a concurrent pull and breaks it.
            docker image prune -f || true
